<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">K²VAE end-to-end code architecture</title>
  <desc id="desc">Overview of configuration, data preparation, Lightning lifecycle, K²VAE internals, evaluation and output with source line references.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:16px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .lane{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;rx:18;filter:url(#shadow)}.laneTitle{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#1e293b}
      .box{stroke-width:1.5;rx:12}.txt{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.small{font:13px 'Segoe UI',Arial,sans-serif;fill:#334155}.code{font:12px Consolas,monospace;fill:#475569}
      .a{fill:#dbeafe;stroke:#60a5fa}.b{fill:#dcfce7;stroke:#4ade80}.c{fill:#fef3c7;stroke:#f59e0b}.d{fill:#f3e8ff;stroke:#c084fc}.e{fill:#ffe4e6;stroke:#fb7185}.f{fill:#e0f2fe;stroke:#38bdf8}
      .line{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
