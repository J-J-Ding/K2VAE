  <rect x="440" y="176" width="280" height="68" class="box a"/><text x="580" y="202" text-anchor="middle" class="txt">ProbTSCli / LightningCLI</text><text x="580" y="225" text-anchor="middle" class="code">run.py:23–216</text>
